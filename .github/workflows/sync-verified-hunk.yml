name: Sync verified Hunk version

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-verified-hunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Record merged Hunk version
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize marker
        run: npm run sync:hunk-version

      - name: Detect marker change
        id: marker
        run: |
          if git diff --quiet -- .github/verified-hunk-version; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify synchronized tree
        if: steps.marker.outputs.changed == 'true'
        run: |
          npm run check
          npm run build
          npm test

      - name: Commit verified version
        if: steps.marker.outputs.changed == 'true'
        run: |
          version="$(cat .github/verified-hunk-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified-hunk-version
          git commit -m "test: record verified hunk ${version}"
          git push
